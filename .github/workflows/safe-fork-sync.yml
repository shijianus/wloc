# Safe, additive backup from Yu9191/wloc into shijianus/wloc.
# Save as .github/workflows/safe-fork-sync.yml (replace the existing file).
name: Safe upstream sync (additive)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: safe-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Yu9191/wloc
  BRANCH: main
  GH_PROMPT_DISABLED: '1'
  GH_NO_UPDATE_NOTIFIER: '1'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream (skip safely if missing)
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          if git fetch --no-tags upstream "refs/heads/${BRANCH}"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::Upstream is missing or unreachable. Fork left unchanged.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Merge code without removing tracked files
        if: steps.upstream.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Code sync failed on line ${LINENO}"' ERR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'Code already includes the upstream tip.'
            exit 0
          fi
          if ! git merge --no-ff --no-commit FETCH_HEAD; then
            git merge --abort || true
            echo '::error::Merge conflict: no changes were pushed.'
            exit 1
          fi
          # Preserve paths that the incoming merge would remove or rename away.
          git diff --no-renames --name-only --diff-filter=D -z HEAD -- \
            | xargs -0 -r git restore --source=HEAD --staged --worktree --
          # Never let upstream replace this workflow.
          git restore --source=HEAD --staged --worktree -- \
            .github/workflows/safe-fork-sync.yml
          git commit -m 'chore: merge upstream (preserve fork files)'
          git push origin "HEAD:refs/heads/${BRANCH}"

      - name: Back up missing tags (no force)
        if: steps.upstream.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Tag sync failed on line ${LINENO}"' ERR
          git ls-remote --tags --refs upstream > "$RUNNER_TEMP/upstream-tags.tsv"
          git ls-remote --tags --refs origin > "$RUNNER_TEMP/fork-tags.tsv"
          while IFS=$'\t' read -r oid ref; do
            [[ "$ref" == refs/tags/* ]] || continue
            fork_oid="$(awk -v r="$ref" '$2 == r {print $1}' "$RUNNER_TEMP/fork-tags.tsv")"
            if [[ -n "$fork_oid" ]]; then
              if [[ "$fork_oid" != "$oid" ]]; then
                echo "::warning::Conflicting tag ${ref}: keeping fork's version."
              fi
              continue
            fi
            echo "Backing up $ref"
            git fetch --no-tags upstream "${ref}:${ref}"
            git push origin "${ref}:${ref}"
          done < "$RUNNER_TEMP/upstream-tags.tsv"

      - name: Back up published Releases and missing assets
        if: steps.upstream.outputs.available == 'true'
        shell: bash
